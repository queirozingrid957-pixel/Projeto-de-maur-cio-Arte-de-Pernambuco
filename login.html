<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

     <header>

        <div class="logo">
            <h2>Arte de Pernambuco</h2>

        </div>

        <nav>

    <main>

            <p>Entre para continuar explorando nossa arte.</p>

            <form>
                <label for="email">E-mail</label>

                <label for="senha">Senha</label>

                <button type="submit">Entrar</button>

        </div>

    </main>

    <footer>
        <p>Arte de Pernambuco - Cultura que inspira</p>
        <p>Projeto desenvolvido para fins educacionais e culturais.</p>
